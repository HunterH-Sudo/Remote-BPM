<!DOCTYPE html>
<html>
<head>
    <title>Church Metronome</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    font-family: Arial;
    margin: 0;
    padding: 30px;
    padding-bottom: 140px; /* room for STOP bar */
    background: #1e1e1e;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
}

h1 {
    font-size: 3rem;
    text-align: center;
}

#songs {
    width: 100%;
    max-width: 1100px;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.song-row {
    display: flex;
    gap: 10px;
    padding: 15px;
    border-radius: 12px;
    border: 2px solid #444;
    align-items: center;
    box-sizing: border-box;
}

input,
select,
button {
    font-size: 1.3rem;
    padding: 10px;
    border-radius: 8px;
    border: none;
    box-sizing: border-box;
}

.song-name {
    flex: 1;
}

.bpm-input {
    width: 100px;
}

.play-button {
    background: #3498db;
    color: white;
}

.remove-button {
    background: #555;
    color: white;
}

.add-button {
    background: #27ae60;
    color: white;
    margin-top: 20px;
    padding: 15px;
}

.stop-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 15px;
    background: #111;
    display: flex;
    justify-content: center;
}

.stop-button {
    background: #e74c3c;
    color: white;
    width: 90%;
    max-width: 700px;
    font-size: 2rem;
}

.active {
    border: 3px solid #27ae60;
}

/* ---------- MOBILE / TABLET ---------- */

@media (max-width: 900px) {

    body {
        padding: 15px;
        padding-bottom: 180px;
    }

    h1 {
        font-size: 2.2rem;
    }

    .song-row {
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
    }

    .song-name,
    .bpm-input,
    select,
    .play-button,
    .remove-button {
        width: 100%;
    }

    input,
    select,
    button {
        font-size: 1.5rem;
        padding: 18px;
    }

    .bpm-input {
        width: 100%;
    }

    .stop-button {
        width: 100%;
        font-size: 2rem;
    }

    #currentSong {
        text-align: center;
        padding-bottom: 120px;
    }
}

/* ---------- SMALL PHONES ---------- */

@media (max-width: 480px) {

    h1 {
        font-size: 1.8rem;
    }

    input,
    select,
    button {
        font-size: 1.3rem;
        padding: 16px;
    }

    .stop-button {
        font-size: 1.7rem;
    }
}
</style>
</head>

<body>

<h1>Church Metronome</h1>

<div id="songs"></div>

<button class="add-button" onclick="addSong()">+ Add Song</button>

<div class="stop-bar">
    <button class="stop-button" onclick="stopMetronome()">STOP</button>
</div>

<div id="currentSong" style="margin-top:40px;font-size:1.5rem;">
    No song playing
</div>

<script>

function uuid() {
    return Date.now().toString() + Math.floor(Math.random() * 100000);
}

async function loadSongs() {
    const res = await fetch("/songs");
    const songs = await res.json();

    document.getElementById("songs").innerHTML = "";

    songs.forEach(s => addSong(s));
}

function addSong(song = {}) {
    const id = song.id || uuid();

    const row = document.createElement("div");
    row.className = "song-row";
    row.id = `song-${id}`;

    row.innerHTML = `
        <input class="song-name" id="name-${id}" value="${song.name || "New Song"}" onchange="saveSongs()">

        <input class="bpm-input" id="bpm-${id}" type="number" value="${song.bpm || 120}" onchange="saveSongs()">

        <select id="sig-${id}" onchange="saveSongs()">
            <option value="2/2" ${song.signature==="2/2"?"selected":""}>2/2</option>
            <option value="3/4" ${song.signature==="3/4"?"selected":""}>3/4</option>
            <option value="4/4" ${song.signature==="4/4"||!song.signature?"selected":""}>4/4</option>
            <option value="6/8" ${song.signature==="6/8"?"selected":""}>6/8</option>
        </select>

        <button class="play-button" onclick="playSong('${id}')">Play</button>
        <button class="remove-button" onclick="removeSong('${id}')">Delete</button>
    `;

    document.getElementById("songs").appendChild(row);    
    saveSongs();
    
}

async function saveSongs() {
    const rows = document.querySelectorAll(".song-row");

    const songs = [];

    rows.forEach(r => {
        const id = r.id.replace("song-", "");

        const nameEl = document.getElementById(`name-${id}`);
        const bpmEl = document.getElementById(`bpm-${id}`);
        const sigEl = document.getElementById(`sig-${id}`);

        if (!nameEl || !bpmEl || !sigEl) return;

        songs.push({
            id: id,
            name: nameEl.value,
            bpm: parseInt(bpmEl.value || 120),
            signature: sigEl.value
        });
    });

    await fetch("/songs", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(songs)
    });
}

async function playSong(id) {
    const name = document.getElementById(`name-${id}`).value;
    const bpm = document.getElementById(`bpm-${id}`).value;
    const sig = document.getElementById(`sig-${id}`).value;

    await fetch("/set_bpm", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({bpm})
    });

    await fetch("/set_signature", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({signature: sig})
    });

    await fetch(`/play/${encodeURIComponent(name)}`, {method:"POST"});

    document.getElementById("currentSong").innerText =
        `Playing: ${name} (${bpm} BPM, ${sig})`;

    document.querySelectorAll(".song-row").forEach(r => r.classList.remove("active"));
    document.getElementById(`song-${id}`).classList.add("active");
}

async function stopMetronome() {
    await fetch("/stop", {method:"POST"});
    document.getElementById("currentSong").innerText = "No song playing";
}

async function removeSong(id) {
    document.getElementById(`song-${id}`).remove();
    await saveSongs();
}

loadSongs();

</script>

</body>
</html>
